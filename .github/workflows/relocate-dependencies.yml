name: Archive relocated Windows dependencies
on:
  push:
    branches: [main]
    paths: [.github/workflows/relocate-dependencies.yml]
permissions:
  contents: write
jobs:
  archive:
    if: github.repository == 'aes-gcm/audio.lgbt'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify copied assets and archive the old release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = 'https://api.github.com/repos/aes-gcm/'
          def request(path, body=None, authenticated=False):
              headers = {'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
              if authenticated:
                  headers['Authorization'] = 'Bearer ' + os.environ['GH_TOKEN']
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(base+path, data=data, headers=headers, method='GET' if body is None else 'PATCH')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          expected = {
              'ffmpeg-x64.zip': (80983242, 'sha256:66bfa3595d633afadf22be4ff5385cbdae8998006e61755e01333491e595b178'),
              'ffmpeg-arm64.zip': (55855892, 'sha256:207ee5796859b6a3ce033393a32ce6b2fe878b6d5753bb8cce979d9c6925e852'),
          }
          def assets(release):
              return {a['name']:(a['size'],a['digest']) for a in release['assets']}
          new = request('audio.lgbt-windows/releases/tags/dependencies-2026-10-15')
          assert not new['draft'] and assets(new) == expected, 'Destination release is incomplete'
          for attempt in range(20):
              runs = request('audio.lgbt-windows/actions/runs?head_sha=cdd64a9532a219c89d902e940fae8ebf16e8c73c')
              checks = [r for r in runs['workflow_runs'] if r['name']=='Windows build and test']
              if any(r['conclusion']=='success' for r in checks):
                  break
              assert not any(r['status']=='completed' for r in checks), 'Windows build did not pass'
              time.sleep(15)
          else:
              raise RuntimeError('Clean Windows build must pass first')
          path = 'audio.lgbt/releases/414993608'
          old = request(path, authenticated=True)
          assert old['tag_name']=='dependencies-2026-10-15' and assets(old)==expected, 'Unexpected source release'
          saved = request(path, {'draft':True}, authenticated=True)
          assert saved['draft'] and assets(saved)==expected, 'Archive verification failed'
          print('Old server release is now a private draft; both assets remain recoverable.')
          PY
